<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消息状态机 — 线框图</title>
<style>
  :root { --g50: #fafafa; --g100: #f5f5f5; --g200: #e5e5e5; --g300: #d4d4d4; --g400: #a3a3a3; --g500: #737373; --g600: #525252; --g700: #404040; --g800: #262626; --g900: #171717; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--g50); color: var(--g800); line-height: 1.5; }
  .app { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--g500); margin-bottom: 24px; }

  .tab-bar { display: flex; gap: 0; border-bottom: 2px solid var(--g200); margin-bottom: 20px; overflow-x: auto; }
  .tab-bar button { padding: 10px 20px; font-size: 13px; border: none; background: none; color: var(--g500); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap; font-family: inherit; }
  .tab-bar button:hover { color: var(--g700); }
  .tab-bar button.active { color: var(--g900); border-bottom-color: var(--g700); font-weight: 600; }

  .flow-bar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 0; font-size: 12px; color: var(--g500); border-bottom: 1px solid var(--g200); margin-bottom: 16px; }
  .flow-step { padding: 4px 10px; border-radius: 4px; background: var(--g100); border: 1px solid var(--g200); white-space: nowrap; }
  .flow-step.current { background: var(--g700); color: #fff; border-color: var(--g700); }
  .flow-step.done { background: var(--g300); border-color: var(--g300); }
  .flow-step.warn { background: var(--g100); border: 1px dashed var(--g400); }

  .chat { border: 1px solid var(--g200); border-radius: 8px; background: #fff; overflow: hidden; }
  .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--g200); font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .chat-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g400); }
  .chat-body { padding: 16px; min-height: 320px; display: flex; flex-direction: column; gap: 12px; }

  .msg { max-width: 80%; padding: 10px 14px; font-size: 14px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--g200); border-radius: 16px 16px 4px 16px; }
  .msg.user.failed { background: var(--g100); border: 1px dashed var(--g400); }
  .msg.ai { align-self: flex-start; background: #fff; border: 1px solid var(--g200); border-radius: 4px 16px 16px 16px; }
  .msg-label { font-size: 10px; text-transform: uppercase; color: var(--g400); letter-spacing: 0.5px; margin-bottom: 2px; }

  .thinking { align-self: flex-start; display: flex; gap: 8px; align-items: center; padding: 12px 16px; border: 1px solid var(--g200); border-radius: 4px 16px 16px 16px; background: #fff; }
  .thinking .dots { display: flex; gap: 4px; }
  .thinking .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--g400); }
  .thinking .label { font-size: 13px; color: var(--g500); }

  .source { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--g100); font-size: 11px; color: var(--g500); }
  .source span { color: var(--g600); text-decoration: underline; cursor: pointer; }

  .actions { display: flex; gap: 12px; padding: 4px 0 4px 40px; }
  .actions button { font-size: 12px; color: var(--g500); background: none; border: none; cursor: pointer; padding: 4px 0; font-family: inherit; }
  .actions button:hover { color: var(--g700); text-decoration: underline; }
  .actions .tbd { font-size: 9px; color: var(--g400); }

  .suggested { margin-top: 4px; padding: 0 0 0 40px; display: flex; flex-direction: column; gap: 4px; }
  .suggested .sq-title { font-size: 11px; color: var(--g500); }
  .suggested .sq-item { padding: 8px 12px; border: 1px solid var(--g200); border-radius: 6px; font-size: 12px; cursor: pointer; background: var(--g50); }
  .suggested .sq-item:hover { background: var(--g100); }

  .error-msg { font-size: 12px; color: var(--g600); text-align: center; padding: 8px; }
  .error-msg .retry { text-decoration: underline; cursor: pointer; }

  .offline-bar { background: var(--g100); border-bottom: 1px solid var(--g300); padding: 8px 16px; font-size: 12px; color: var(--g600); text-align: center; display: none; }
  .offline-bar.show { display: block; }

  .input-area { border-top: 1px solid var(--g200); padding: 12px 16px; display: flex; gap: 8px; align-items: center; }
  .input-area input { flex: 1; padding: 10px 16px; border: 1px solid var(--g200); border-radius: 20px; font-size: 14px; outline: none; font-family: inherit; background: var(--g50); }
  .input-area input:focus { border-color: var(--g400); background: #fff; }
  .input-area input:disabled { background: var(--g100); color: var(--g400); }
  .input-area button { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--g700); color: #fff; font-size: 16px; cursor: pointer; flex-shrink: 0; }
  .input-area button:disabled { background: var(--g300); cursor: default; }

  .annotation { font-size: 10px; color: var(--g400); margin: 8px 0; padding: 6px 10px; background: var(--g50); border-left: 2px solid var(--g300); }

  @media (max-width: 600px) {
    .app { padding: 12px 8px; }
    .chat-body { padding: 12px; }
    .msg { max-width: 90%; font-size: 13px; }
    .tab-bar button { padding: 8px 14px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">

  <h1>消息状态机</h1>
  <p class="subtitle">线框图 · 灰度结构评审 · 颜色/间距/组件打磨推迟到 Mockup 阶段</p>

  <div class="flow-bar" id="flowBar"></div>

  <div class="tab-bar" id="tabBar">
    <button class="active" data-view="normal">正常流转</button>
    <button data-view="failed">发送失败</button>
    <button data-view="offline">离线状态</button>
    <button data-view="rapid">连续快速发送</button>
  </div>

  <div class="chat">
    <div class="chat-header"><span class="dot"></span> AI 智能助手</div>
    <div class="offline-bar" id="offlineBar">当前网络不可用，请检查网络连接后重试</div>
    <div class="chat-body" id="chatBody"></div>
    <div class="input-area">
      <input type="text" id="chatInput" placeholder="在这里输入你的问题…" disabled>
      <button id="sendBtn" disabled>→</button>
    </div>
  </div>

  <p class="annotation">标注：本线框图仅用于评审信息层次、状态流转逻辑和内容结构。颜色、字体、间距、圆角、阴影等视觉细节将在后续高保真原型中确定。</p>

</div>

<script>
  const body = document.getElementById('chatBody'), input = document.getElementById('chatInput'), send = document.getElementById('sendBtn');
  const flowBar = document.getElementById('flowBar'), offlineBar = document.getElementById('offlineBar');

  function clear() { body.innerHTML = ''; offlineBar.classList.remove('show'); }
  function scroll() { body.scrollTop = body.scrollHeight; }

  function userMsg(text, failed) {
    const d = document.createElement('div');
    d.className = 'msg user' + (failed ? ' failed' : '');
    d.innerHTML = '<div class="msg-label">' + (failed ? 'FAILED' : 'SENT') + '</div>' + text;
    body.appendChild(d); scroll();
  }

  function aiThinking() {
    const d = document.createElement('div'); d.className = 'thinking';
    d.innerHTML = '<div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><span class="label">AI 正在思考…</span>';
    body.appendChild(d); scroll(); return d;
  }

  function aiMsg(text, withSource, withSuggested) {
    const d = document.createElement('div'); d.className = 'msg ai';
    let html = '<div class="msg-label">COMPLETED</div>' + text;
    if (withSource) html += '<div class="source">来源：<span>车辆手册 V3.2</span> · <span>技术公告 2024-003</span></div>';
    html += '<div class="annotation">内容由 AI 生成，仅供参考</div>';
    d.innerHTML = html; body.appendChild(d);
    if (withSuggested) {
      const acts = document.createElement('div'); acts.className = 'actions';
      acts.innerHTML = '<button>👍 有帮助 <span class="tbd">[TBD]</span></button><button>👎 没帮助 <span class="tbd">[TBD]</span></button><button>📋 复制 <span class="tbd">[TBD]</span></button><button>🔊 语音播报</button>';
      body.appendChild(acts);
      const sug = document.createElement('div'); sug.className = 'suggested';
      sug.innerHTML = '<div class="sq-title">你可能还想问：</div><div class="sq-item">VIN 码一般在车辆的什么位置？</div><div class="sq-item">如何通过 VIN 码查询保养记录？</div>';
      body.appendChild(sug);
    }
    scroll();
  }

  function errorMsg(text, retry) {
    const d = document.createElement('div'); d.className = 'error-msg';
    d.innerHTML = '⚠ ' + text + (retry ? ' <span class="retry" onclick="normalFlow()">点击重试</span>' : '');
    body.appendChild(d); scroll();
  }

  function setFlow(steps, idx) {
    flowBar.innerHTML = steps.map((s, i) => {
      let cls = 'flow-step';
      if (i < idx) cls += ' done'; else if (i === idx) cls += s.includes('失败') || s.includes('Failed') ? ' warn' : ' current';
      const arrow = i < steps.length - 1 ? ' → ' : '';
      return '<span class="' + cls + '">' + s + '</span>' + arrow;
    }).join('');
  }

  function normalFlow() {
    clear(); input.disabled = true; send.disabled = true; input.placeholder = 'AI 正在思考中…';
    setFlow(['User Sent','AI Waiting','AI Streaming','AI Completed','Suggested Q','Archived'], 0);
    userMsg('我的 VIN 码是多少？');
    setTimeout(() => { setFlow(['User Sent','AI Waiting','AI Streaming','AI Completed','Suggested Q','Archived'], 1); const t = aiThinking();
      setTimeout(() => { setFlow(['User Sent','AI Waiting','AI Streaming','AI Completed','Suggested Q','Archived'], 3); t.remove();
        aiMsg('您的 VIN 码可以在前挡风玻璃左下角、驾驶座车门内侧铭牌以及车辆行驶证上找到。VIN 码由 17 位字符组成，包含车辆制造商、车型、发动机类型等信息。', true, true);
        setFlow(['User Sent','AI Waiting','AI Streaming','AI Completed','Suggested Q','Archived'], 4);
        input.disabled = false; send.disabled = false; input.placeholder = '在这里输入你的问题…';
      }, 2000);
    }, 800);
  }

  function failedFlow() {
    clear(); input.disabled = false; send.disabled = false; input.placeholder = '在这里输入你的问题…';
    setFlow(['Sent','Sent → Failed','网络断开','恢复'], 0);
    userMsg('我的 VIN 码是多少？');
    setTimeout(() => {
      body.innerHTML = '';
      setFlow(['Sent','Sent → Failed','网络断开','恢复'], 1);
      userMsg('我的 VIN 码是多少？', true);
      errorMsg('发送失败 — 网络已断开', true);
    }, 1500);
  }

  function offlineFlow() {
    clear(); input.disabled = true; send.disabled = true; input.placeholder = '网络不可用，无法发送消息';
    offlineBar.classList.add('show');
    setFlow(['在线','断网','输入冻结','恢复'], 1);
    userMsg('帮我查一下车辆信息');
    aiMsg('好的，请提供您的 VIN 码，我帮您查询车辆信息。', false, false);
    setTimeout(() => {
      setFlow(['在线','断网','输入冻结','恢复'], 3);
      offlineBar.classList.remove('show');
      input.disabled = false; send.disabled = false; input.placeholder = '在这里输入你的问题…';
    }, 3000);
  }

  function rapidFlow() {
    clear(); input.disabled = false; send.disabled = false; input.placeholder = '在这里输入你的问题…';
    setFlow(['Sent×3','AI#1 Wait','AI#1 Done','AI#2 Wait','AI#2 Done','AI#3 Done'], 0);
    const msgs = ['我的 VIN 码是多少？', '帮我查一下保养记录', '最近的维修站在哪？'];
    const replies = ['您的 VIN 码可以在前挡风玻璃左下角、驾驶座车门内侧铭牌找到。', '保养记录可通过 APP 或授权服务站查询，建议每 3 万公里进行一次常规保养。', '最近的服务站在浦东新区金桥路 1888 号。'];
    msgs.forEach((t, i) => setTimeout(() => userMsg(t), i * 400));
    function aiReply(idx) {
      if (idx >= 3) return;
      const fi = 1 + idx * 2;
      setTimeout(() => { setFlow(['Sent×3','AI#1 Wait','AI#1 Done','AI#2 Wait','AI#2 Done','AI#3 Done'], fi); const w = aiThinking(); }, 1200 + idx * 3000);
      setTimeout(() => { setFlow(['Sent×3','AI#1 Wait','AI#1 Done','AI#2 Wait','AI#2 Done','AI#3 Done'], fi + 1); const w = document.querySelector('.thinking'); if (w) w.remove(); aiMsg(replies[idx], false, idx === 2); if (idx < 2) aiReply(idx + 1); }, 2500 + idx * 3000);
    }
    setTimeout(() => aiReply(0), 2000);
  }

  document.getElementById('tabBar').addEventListener('click', e => {
    if (e.target.tagName !== 'BUTTON') return;
    document.querySelectorAll('.tab-bar button').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    switch (e.target.dataset.view) {
      case 'normal': normalFlow(); break;
      case 'failed': failedFlow(); break;
      case 'offline': offlineFlow(); break;
      case 'rapid': rapidFlow(); break;
    }
  });
  normalFlow();
</script>
</body>
</html>
